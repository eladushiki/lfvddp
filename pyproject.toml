[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "SymmetrizedDDP"
version = "0.1.0"
description = "Symmetrized DDP research project infrastructure and tools"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Elad Kliger", email = "elad.kliger@weizmann.ac.il" }]
dependencies = [
    "absl-py==1.4.0",
    "astunparse==1.6.3",
    "awkward==2.9.0",
    "awkward-pandas==2023.8.0",
    "awkward_cpp==52",
    "camel-converter==4.0.1",
    "certifi==2024.8.30",
    "charset-normalizer==3.4.0",
    "contourpy==1.0.7",
    "cramjam==2.10.0",
    "cycler==0.12.1",
    "flatbuffers==25.12.19",
    "fonttools==4.40.0",
    "fsspec==2025.2.0",
    "fsspec-xrootd==0.5.5",
    "gast==0.6.0",
    "google-pasta==0.2.0",
    "grpcio==1.80.0",
    "h5py==3.13.0",
    "idna==3.18",
    "importlib_metadata==9.0.0",
    "importlib_resources==6.5.2",
    "keras==3.14.0",
    "kiwisolver==1.4.5",
    "libclang==18.1.1",
    "Markdown==3.7",
    "markdown-it-py==2.2.0",
    "MarkupSafe==2.1.5",
    "matplotlib==3.11.0",
    "mdurl==0.1.2",
    "ml_dtypes==0.5.1",
    "namex==0.0.8",
    "numpy==2.4.4",
    "opt_einsum==3.3.0",
    "optree==0.14.1",
    "packaging==24.2",
    "pandas==2.2.3",
    "pillow==11.2.1",
    "protobuf==7.34.1",
    "Pygments==2.18.0",
    "pyparsing==3.2.5",
    "pytest==9.0.3",
    "pytest-cov==7.0.0",
    "pytest-timeout==2.4.0",
    "python-dateutil==2.9.0.post0",
    "pytz==2022.7.1",
    "PyYAML==6.0.2",
    "regex==2023.5.5",
    "requests==2.32.3",
    "rich==13.9.4",
    "scipy==1.17.1",
    "six==1.17.0",
    "tensorboard==2.20.0",
    "tensorboard-data-server==0.7.2",
    "tensorflow_cpu==2.21.0",
    "torch==2.11.0",
    "tqdm==4.67.1",
    "termcolor==2.4.0",
    "typing_extensions==4.15.0",
    "tzdata==2024.1",
    "uproot==5.7.1",
    "urllib3==2.7.0",
    "Werkzeug==3.1.3",
    "wrapt==1.16.0",
    "xxhash==3.5.0",
    "zipp==3.20.2"
]

[project.scripts]
train = "train.single_train:main"
submit_train = "train.submit_train:main"
is_same_as_commit = "frame.cluster.is_same_as_commit:main"
aggregate_train_results = "frame.aggregate_train_results:main"

[tool.setuptools.packages.find]
include = ["configs*", "data_tools*", "frame*", "neural_networks*", "plot*"]

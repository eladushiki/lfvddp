[pytest]
# Pytest configuration file

# Specify test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Minimum Python version
minversion = 7.0

# Add markers for custom test categorization
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
    fast: Fast running tests
    long: Long running tests (no timeout)
    remote: Tests that read public network data (opt in with --run-remote-tests)
    server: Tests that submit real jobs to a server scheduler (opt in with --run-server-tests)
    skip: Tests to skip
    xfail: Expected failures

# Options for test discovery and running
addopts =
    -v
    -s
    --strict-markers
    --tb=short

# Test paths
testpaths = test

# Timeout for individual tests (requires pytest-timeout)
# Applied only to tests NOT marked with 'long'
timeout = 300
timeout_method = thread
